<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Deepak Suiwal — AI Agency">
  <defs>
    <linearGradient id="deepakHeroRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF1E1E"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
  <pattern id="deepakHeroGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#F1EDEA"/>
    </pattern>
    <filter id="deepakHeroGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="#FFFFFF"/>
  <rect width="1200" height="360" fill="url(#deepakHeroGrid)"/>

  <!-- soft red wash, bottom right -->
  <ellipse cx="1020" cy="330" rx="420" ry="180" fill="#FF1E1E" opacity="0.07"/>
  <ellipse cx="180" cy="20" rx="300" ry="120" fill="#FF6B00" opacity="0.05"/>

  <!-- underline -->
  <path d="M66 268 H 470" stroke="#FF1E1E" stroke-width="7" stroke-linecap="round"/>
  <text x="64" y="148" font-family="Poppins, Arial, Helvetica, sans-serif" font-size="66" font-weight="800" fill="#1F2328" letter-spacing="-1">Deepak Suiwal</text>
  <text x="66" y="196" font-family="Poppins, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FF1E1E">AI Agency — Real builds, no gyaan</text>
  <text x="66" y="236" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#5A6470">AI agents that reply, follow up &amp; close 24/7</text>

  <!-- floating orbs, right side -->
  <g>
    <circle cx="1010" cy="120" r="54" fill="#FF1E1E"/>
    <circle cx="1010" cy="120" r="54" fill="none" stroke="#FF1E1E" stroke-width="2" opacity="0.35">
      <animate attributeName="r" values="54; 66; 54" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35; 0; 0.35" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="205" r="34" fill="#FF6B00">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1108" cy="220" r="22" fill="#1F2328">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 10; 0 0" dur="4.6s" repeatCount="indefinite"/>
    </circle>
    <text x="1010" y="138" text-anchor="middle" font-family="Poppins, Arial, Helvetica, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">AI</text>
  </g>

  <!-- small plus marks -->
  <g fill="#FF1E1E" opacity="0.55">
    <path d="M700 92 h14 v-14 h6 v14 h14 v6 h-14 v14 h-6 v-14 h-14 z"/>
    <path d="M840 300 h10 v-10 h5 v10 h10 v5 h-10 v10 h-5 v-10 h-10 z"/>
  </g>
</svg>
